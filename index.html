<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Support Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <section class="chat-card">
      <header class="chat-header">
        <div class="brand">
          <div class="avatar">CS</div>
          <div>
            <h1>Customer Support</h1>
            <p><span class="status-dot"></span> Online</p>
          </div>
        </div>
        <button id="clearChat" class="icon-btn" title="Clear conversation">↺</button>
      </header>

      <div id="chatMessages" class="chat-messages" aria-live="polite">
        <div class="message-row bot-row">
          <div class="message bot-message">
            <p>Hello! 👋 How can we help you today?</p>
            <span class="message-time">Now</span>
          </div>
        </div>
      </div>

      <div id="typing" class="typing hidden">
        <span></span><span></span><span></span>
        <label>Support is typing...</label>
      </div>

      <form id="chatForm" class="chat-input-area">
        <button type="button" id="attachBtn" class="input-btn" title="Attach file">＋</button>
        <input
          id="messageInput"
          type="text"
          placeholder="Type your message..."
          autocomplete="off"
          maxlength="2000"
        >
        <button type="submit" id="sendBtn" class="send-btn" title="Send message">➤</button>
      </form>

      <footer class="chat-footer">
        Powered by your customer support system
      </footer>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
